name: MindSpace
options:
  bundleIdPrefix: com.bookchaowalit
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: "MindSpace/Info.plist"
targets:
  MindSpace:
    type: application
    platform: iOS
    sources:
      - path: Sources/MindSpace
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.bookchaowalit.mindspace"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
